
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Little Universe ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: linear-gradient(145deg, #180e19, #51243c, #210f25);
  color: #fff0f5;
  font-family: Georgia, serif;
  overflow-x: hidden;
}

.welcome {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 28px;
  position: relative;
  overflow: hidden;
}

.small {
  color: #f6b9d0;
  letter-spacing: 4px;
  font-size: 11px;
  margin-bottom: 30px;
}

.heart {
  font-size: 65px;
  animation: heartbeat 1.5s infinite;
  filter: drop-shadow(0 0 20px #ff80b5);
}

h1 {
  font-size: clamp(34px, 9vw, 52px);
  font-weight: normal;
  font-style: italic;
  margin: 25px 0 18px;
  color: #ffe0ec;
  text-shadow: 0 0 20px #ff8eb8;
}

.message {
  max-width: 340px;
  font-size: 16px;
  line-height: 1.9;
  color: #f6d6e3;
}

.start {
  margin-top: 38px;
  border: 1px solid #ffc1d9;
  border-radius: 35px;
  padding: 15px 30px;
  color: #fff;
  background: linear-gradient(90deg,#b74376,#80365f);
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 0 25px #c45b8c66;
}

.start:active {
  transform: scale(.96);
}

.footer {
  margin-top: 55px;
  font-size: 12px;
  color: #e8afc7;
  letter-spacing: 2px;
}

.floating {
  position: absolute;
  bottom: -30px;
  animation: floatUp 8s linear infinite;
  opacity: .7;
  pointer-events: none;
}

@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh) rotate(30deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<section class="welcome">

  <div class="small">♡ A LITTLE WORLD FOR YOU ♡</div>

  <div class="heart">❤️</div>

  <h1>Hey, My Princess!</h1>

  <p class="message">
    I made something special for you...
    <br><br>
    Every little page holds a piece of my heart,
    every memory tells our story,
    and every word is meant just for you.
    <br><br>
    You are my favourite part of this beautiful journey. 🥹
  </p>

  <button class="start" onclick="beginJourney()">
    Start Our Journey ♡
  </button>

  <div class="footer">
    MADE WITH LOVE, ONLY FOR YOU
  </div>

</section>

<script>
function beginJourney() {
  alert("Our little universe is just beginning! ❤️");
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "floating";
  heart.innerHTML = ["♡","♥","💗","✨"][Math.floor(Math.random()*4)];
  heart.style.left = Math.random()*100 + "vw";
  heart.style.fontSize = (15 + Math.random()*20) + "px";
  heart.style.animationDuration = (5 + Math.random()*6) + "s";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 11000);
}

setInterval(createHeart, 650);
</script>

</body>
    </html>
